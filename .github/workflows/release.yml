name: Release

# Semantic Release Approach:
# - Uses semantic-release for automatic versioning based on conventional commits
# - Plugins: commit-analyzer, release-notes-generator, git, exec, github
# - Version synced to gradle.properties for Android build
#
# CI Optimization:
# - Path filters prevent unnecessary runs on docs-only changes

on:
  push:
    branches: [main]
    # Only trigger on relevant file changes (app code, gradle configs, workflow itself)
    # Excludes: markdown, docs, non-code files to avoid unnecessary CI runs
    paths:
      - "app/**"
      - "*.gradle*"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
  # Wait for CI to pass before running release
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Dry-run on pull requests to validate semantic-release config
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle*"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "package.json"
      - ".commitlintrc.json"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Dry-run validation on PRs - doesn't publish anything
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install npm dependencies
        run: npm install

      - name: Semantic Release Dry-Run
        run: npx semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    # Only run if CI workflow succeeded AND commit doesn't contain [skip release]
    if: "!contains(github.event.head_commit.message, '[skip release]') && github.event.workflow_run.conclusion == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Install npm dependencies
        run: npm install

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode keystore
        run: |
          echo "$RELEASE_KEYSTORE" | base64 -d > $RUNNER_TEMP/release.jks
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}

      - name: Run semantic-release
        id: semantic-release
        uses: cycjimmy/semantic-release-action@v6
        with:
          branches: main
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/git
            @semantic-release/exec
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEYSTORE_PATH: ${{ env.RELEASE_KEYSTORE_PATH }}
