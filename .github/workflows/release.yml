name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode keystore
        run: |
          echo "$RELEASE_KEYSTORE" | base64 -d > $RUNNER_TEMP/release.jks
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}

      - name: Bump version
        id: version
        run: |
          CURRENT_CODE=$(grep 'versionCode' app/build.gradle.kts | grep -o '[0-9]\+')
          NEW_CODE=$((CURRENT_CODE + 1))

          CURRENT_NAME=$(grep 'versionName' app/build.gradle.kts | grep -o '"[^"]*"' | tr -d '"')
          # Increment patch: 1.0 → 1.0.0, 1.0.0 → 1.0.1
          if [[ "$CURRENT_NAME" =~ ^[0-9]+\.[0-9]+$ ]]; then
            NEW_NAME="${CURRENT_NAME}.0"
          elif [[ "$CURRENT_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PATCH=$(echo "$CURRENT_NAME" | cut -d. -f3)
            NEW_NAME=$(echo "$CURRENT_NAME" | awk -F. -v OFS=. '{$3=$3+1; print}')
          else
            NEW_NAME="$CURRENT_NAME"
          fi

          echo "VERSION_CODE=$NEW_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$NEW_NAME" >> $GITHUB_ENV
          echo "RELEASE_TAG=v${NEW_NAME}" >> $GITHUB_ENV
          echo "Bumped version to $NEW_NAME (code: $NEW_CODE, tag: v${NEW_NAME})"

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Generate release notes
        id: notes
        uses: actions/github-script@v7
        with:
          script: |
            // Try to get the previous release tag
            const { data: tags } = await github.rest.repos.listTags({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 10
            });

            const releaseTags = tags
              .map(t => t.name)
              .filter(t => t.startsWith('v'))
              .sort((a, b) => {
                const parse = v => v.replace('v', '').split('.').map(Number);
                const [aM, aN, aP] = parse(a);
                const [bM, bN, bP] = parse(b);
                return (bM - aM) || (bN - aN) || (bP - aP);
              });

            const baseTag = releaseTags.length > 0 ? releaseTags[0] : null;
            const base = baseTag || 'HEAD~1';
            const head = context.sha;

            let commits;
            try {
              const { data } = await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: base,
                head: head
              });
              commits = data.commits;
            } catch {
              // Fallback: get commits from the push event
              commits = context.payload.commits || [];
            }

            // Group by conventional commit type
            const grouped = { feat: [], fix: [], chore: [], other: [] };
            for (const commit of commits) {
              const msg = commit.commit.message.split('\n')[0];
              if (msg.startsWith('feat:')) grouped.feat.push(msg);
              else if (msg.startsWith('fix:')) grouped.fix.push(msg);
              else if (msg.startsWith('chore:')) grouped.chore.push(msg);
              else grouped.other.push(msg);
            }

            let notes = '## Changes\n\n';
            if (grouped.feat.length) notes += '### Features\n' + grouped.feat.map(c => `- ${c}`).join('\n') + '\n\n';
            if (grouped.fix.length) notes += '### Fixes\n' + grouped.fix.map(c => `- ${c}`).join('\n') + '\n\n';
            if (grouped.chore.length) notes += '### Chores\n' + grouped.chore.map(c => `- ${c}`).join('\n') + '\n\n';
            if (grouped.other.length) notes += '### Other\n' + grouped.other.map(c => `- ${c}`).join('\n') + '\n';

            return notes;
          result-encoding: string

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.VERSION_NAME }}
          body: ${{ steps.notes.outputs.result }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
