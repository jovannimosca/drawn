name: Release

# Semantic Release Approach:
# - Uses semantic-release for automatic versioning based on conventional commits
# - Plugins: commit-analyzer, release-notes-generator, github
# - Version synced to gradle.properties for Android build
#
# CI Optimization:
# - Path filters prevent unnecessary runs on docs-only changes

on:
  push:
    branches: [main]
    # Only trigger on relevant file changes (app code, gradle configs, workflow itself)
    # Excludes: markdown, docs, non-code files to avoid unnecessary CI runs
    paths:
      - "app/**"
      - "*.gradle*"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
  # Wait for CI to pass before running release
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Only run if CI workflow succeeded AND commit doesn't contain [skip release]
    if: "!contains(github.event.head_commit.message, '[skip release]') && github.event.workflow_run.conclusion == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Install npm dependencies
        run: npm install

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode keystore
        run: |
          echo "$RELEASE_KEYSTORE" | base64 -d > $RUNNER_TEMP/release.jks
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}

      - name: Run semantic-release
        id: semantic-release
        uses: cycjimmy/semantic-release-action@v6
        with:
          branches: main
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull updated gradle.properties
        run: git pull

      - name: Read version from gradle.properties
        run: |
          echo "VERSION_NAME=$(grep '^version=' gradle.properties | cut -d= -f2)" >> $GITHUB_ENV
          echo "VERSION_CODE=$(grep '^versionCode=' gradle.properties | cut -d= -f2)" >> $GITHUB_ENV
          echo "RELEASE_TAG=v$(grep '^version=' gradle.properties | cut -d= -f2)" >> $GITHUB_ENV

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Attach APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.semantic-release.outputs.upload_url }}
          asset_path: app/build/outputs/apk/release/app-release.apk
          asset_name: drawn-${{ env.VERSION_NAME }}.apk
          asset_content_type: application/vnd.android.base.apk