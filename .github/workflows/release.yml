name: Release

# Semantic Release Approach:
# - Uses semantic-release for automatic versioning based on conventional commits
# - Plugins: commit-analyzer, release-notes-generator, github
# - Output variables: VERSION_NAME, RELEASE_TAG for subsequent steps
#
# CI Optimization:
# - Path filters prevent unnecessary runs on docs-only changes (app/, *.gradle*, gradle/)
# - workflow_dispatch provides manual override for special release scenarios
# - skip_release input allows building without releasing

on:
  push:
    branches: [main]
    # Only trigger on relevant file changes (app code, gradle configs, workflow itself)
    # Excludes: markdown, docs, non-code files to avoid unnecessary CI runs
    paths:
      - "app/**"
      - "*.gradle*"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
  # Manual trigger with override options
  workflow_dispatch:
    inputs:
      skip_release:
        description: "Skip creating a release (build only)"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Skip if commit message contains [skip release] OR if skip_release input is true
    if: "(!contains(github.event.head_commit.message, '[skip release]')) && (github.event.inputs.skip_release != 'true')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode keystore
        run: |
          echo "$RELEASE_KEYSTORE" | base64 -d > $RUNNER_TEMP/release.jks
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}

      - name: Run semantic-release
        id: semantic-release
        uses: cycjimmy/semantic-release-action@v4
        with:
          branches: main
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version outputs
        run: |
          echo "VERSION_NAME=${{ steps.semantic-release.outputs.version }}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${{ steps.semantic-release.outputs.tag }}" >> $GITHUB_ENV

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

  build-only:
    # Separate job for build-only scenarios (skip release)
    if: "github.event.inputs.skip_release == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode keystore
        run: |
          echo "$RELEASE_KEYSTORE" | base64 -d > $RUNNER_TEMP/release.jks
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}